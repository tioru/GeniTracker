name: Deploy Angular App to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    # Character images are not versioned: restore the previous run's download, then
    # fetch only the missing ones. A new key each run so newly added images are saved too.
    - name: Cache character images
      uses: actions/cache@v4
      with:
        path: src/assets/img/characters/portrait
        key: character-images-${{ github.run_id }}
        restore-keys: character-images-

    - name: Export character details and images
      run: npm run data:character-details

    - name: Configure Git
      run: |
        git config --global user.email "thomas@test.com"
        git config --global user.name "C moi toma"
        
    - name: Deploy with angular-cli-ghpages
      run: |
        npm run ng deploy -- --base-href=/GeniTracker/ --no-silent
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}