<div animate.enter="slideIn" animate.leave="slideOut" [class.backgroundMask]="backgroundMask" class="dialog-outside-container" (mousedown)="onOutsideMouseDown()" (mouseup)="onOutsideMouseUp()" *ngIf="resetFields">
    <div id="dialog-container" [style]="{'height': height, 'width': width, 'border-width': borderWidth}" class="dialog-container flex column" (mousedown)="$event.stopPropagation()">
        <div *ngIf="style === dialogStyle.HBF" class="header fw" [class]="style === dialogStyle.HBF ? 'top-element' : ''">
            <div *ngIf="draggable && style === dialogStyle.HBF" class="draggable-handle" (mousedown)="onDragStart($event)"></div>
            <ng-content select="[header]"></ng-content>
        </div>
        <div class="body fh fw flex aic jcc column" [class]="style === dialogStyle.BF ? 'top-element' : style === dialogStyle.B ? 'only-element' : ''">
            <div *ngIf="draggable && style === dialogStyle.B" class="draggable-handle" (mousedown)="onDragStart($event)"></div>
            <ng-content select="[body]"></ng-content>
        </div>
        <div *ngIf="style === dialogStyle.HBF || style === dialogStyle.BF" class="bottom-element fw">
            <ng-content select="[footer]"></ng-content>
        </div>
    </div>
</div>
