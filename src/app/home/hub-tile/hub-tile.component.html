<a *transloco="let t" [routerLink]="tile().route ?? null" [class.soon]="!tile().route">
    <img [src]="tile().img" alt="" loading="lazy">
    <span class="num">{{ roman() }}</span>
    <div class="foot">
    <div>
      <div class="label">{{ t('home.tiles.' + tile().key) }}</div>
      <div class="sub">{{ sub() || (tile().route ? '' : t('home.soon')) }}</div>
    </div>
  </div>
</a>
