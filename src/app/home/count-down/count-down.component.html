<div class="countdown-container">
  <div class="time-group">
    <span class="digit" [@fadeInOut]>{{ hours[0] }}</span>
    <span class="digit" [@fadeInOut]>{{ hours[1] }}</span>
    <span class="separator">:</span>
  </div>
  
  <div class="time-group">
    <span class="digit" [@fadeInOut]>{{ minutes[0] }}</span>
    <span class="digit" [@fadeInOut]>{{ minutes[1] }}</span>
    <span class="separator">:</span>
  </div>
  
  <div class="time-group">
    <span class="digit" [@fadeInOut]>{{ seconds[0] }}</span>
    <span class="digit" [@fadeInOut]>{{ seconds[1] }}</span>
  </div>
</div>
