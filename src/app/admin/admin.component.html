<div class="fh fw flex aic jcc">
    <div class="fw fh flex aic jcc" style="overflow-y: hidden; max-height: 90%">
        <div [@enter-leave] class="black_div flex aic jcc column" style="text-align: center; padding: 0 20px 20px 20px">
            <div>
                <h1 class="welcome-title">{{selectedAdminPanel}}</h1>
            </div>
            <div [@enter-leave] class="back-button" *ngIf="selectedAdminPanel !== adminPanels.DASHBOARD">
                <button class="button" (click)="selectAdminPanel(adminPanels.DASHBOARD)" style="padding: 10px;">
                    <svg xmlns="http://www.w3.org/2000/svg" height="30px" fill="white" viewBox="0 0 24 24"><path d="M20,9V15H12V19.84L4.16,12L12,4.16V9H20Z" /></svg>
                </button>
            </div>
            <div class="content-container">
                <div [@contentAnimation] class="stats-container" *ngIf="selectedAdminPanel === adminPanels.DASHBOARD && !alterningView">
                    <button class="button flex column aic">
                        <img src="assets/img/Characters.png" height="40px">
                        <span class="stat-label">Personnages</span>
                    </button>
                    <button class="button flex column aic">
                        <img src="assets/img/Weapons.png" height="40px">
                        <span class="stat-label">Armes</span>
                    </button>
                    <button class="button flex column aic">
                        <img src="assets/img/Events.png" height="40px">
                        <span class="stat-label">Événements</span>
                    </button>
                    <button class="button flex column aic" (click)="selectAdminPanel(adminPanels.VERSIONS)">
                        <svg xmlns="http://www.w3.org/2000/svg" height="40px" fill="white" viewBox="0 0 24 24"><path d="M4,4H20A2,2 0 0,1 22,6V18A2,2 0 0,1 20,20H4A2,2 0 0,1 2,18V6A2,2 0 0,1 4,4M4,6V18H11V6H4M20,18V6H18.76C19,6.54 18.95,7.07 18.95,7.13C18.88,7.8 18.41,8.5 18.24,8.75L15.91,11.3L19.23,11.28L19.24,12.5L14.04,12.47L14,11.47C14,11.47 17.05,8.24 17.2,7.95C17.34,7.67 17.91,6 16.5,6C15.27,6.05 15.41,7.3 15.41,7.3L13.87,7.31C13.87,7.31 13.88,6.65 14.25,6H13V18H15.58L15.57,17.14L16.54,17.13C16.54,17.13 17.45,16.97 17.46,16.08C17.5,15.08 16.65,15.08 16.5,15.08C16.37,15.08 15.43,15.13 15.43,15.95H13.91C13.91,15.95 13.95,13.89 16.5,13.89C19.1,13.89 18.96,15.91 18.96,15.91C18.96,15.91 19,17.16 17.85,17.63L18.37,18H20M8.92,16H7.42V10.2L5.62,10.76V9.53L8.76,8.41H8.92V16Z" /></svg>
                        <span class="stat-label">Versions</span>
                    </button>
                    <button class="button flex column aic" (click)="selectAdminPanel(adminPanels.DAILY_RESET)">
                        <svg xmlns="http://www.w3.org/2000/svg" height="40px" fill="white" viewBox="0 0 24 24"><path d="M6,2H18V8H18V8L14,12L18,16V16H18V22H6V16H6V16L10,12L6,8V8H6V2M16,16.5L12,12.5L8,16.5V20H16V16.5M12,11.5L16,7.5V4H8V7.5L12,11.5M10,6H14V6.75L12,8.75L10,6.75V6Z" /></svg>
                        <span class="stat-label">Daily Reset</span>
                    </button>
                </div>
                <div [@contentAnimation] *ngIf="selectedAdminPanel === adminPanels.VERSIONS && !alterningView">
                    <app-admin-versions></app-admin-versions>
                </div>
                <div [@contentAnimation] *ngIf="selectedAdminPanel === adminPanels.DAILY_RESET && !alterningView">
                    <app-admin-daily-reset></app-admin-daily-reset>
                </div>
            </div>
        </div>
    </div>
</div>
